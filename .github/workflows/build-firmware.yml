# AI Passport 固件构建(mic-mode 补丁) —— 放到 fork 的
# .github/workflows/build-firmware.yml 即可;推 mic-mode 分支或手动触发。
# 产物: 可从 0x0 烧录的合并 full.bin(esptool / tool.folotoy.cn 均可刷)。
name: build-firmware

on:
  workflow_dispatch:
  push:
    branches:
      - "mic-mode"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.3
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (ESP32-C3)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          cd "$GITHUB_WORKSPACE"
          for i in 1 2; do
            echo "=== 构建尝试 $i ==="
            # 组件源(CDN)偶发下载损坏 → 每次尝试前清掉半成品
            rm -rf managed_components dependencies.lock
            if idf.py set-target esp32c3 && idf.py build; then
              echo "构建成功(第 $i 次尝试)"
              exit 0
            fi
            echo "第 $i 次失败,清理后重试..."
            rm -rf managed_components dependencies.lock build
          done
          echo "=== 两次均失败,输出 idf 详细错误 ==="
          tail -n 120 build/log/idf_py_stderr_output_* 2>/dev/null || true
          exit 1

      - name: Merge full.bin (0x0 可烧录)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd "$GITHUB_WORKSPACE"
          if idf.py merge-bin -o full.bin; then
            echo "idf.py merge-bin ok"
          else
            # 回退:显式偏移合并(C3: bootloader 0x0 / 分区表 0x8000 /
            # app = 分区表 v2 的 ota_0 偏移 0x20000,改分区表必须同步改这里!)
            python "$IDF_PATH/components/esptool_py/esptool/esptool.py" \
              --chip esp32c3 merge_bin -o full.bin \
              --flash_mode dio --flash_size 8MB --flash_freq 80m \
              0x0     build/bootloader/bootloader.bin \
              0x8000  build/partition_table/partition-table.bin \
              0x20000 build/FoloToy-AI-Passport.bin
          fi
          ls -la full.bin
          sha256sum full.bin
          # 落位自检:分区表 v2 的 ota_0 = 0x20000,app 必须出现在那里
          # (防御 merge 偏移与 partitions.csv 脱节 —— 0x10000 旧布局会刷成砖启动失败)
          python3 - <<'EOF'
          data = open('full.bin', 'rb').read()
          assert data[0x20000] == 0xE9, f"app 未落在 0x20000: {data[0x20000:0x20004].hex()}"
          ver = data[0x20030:0x20050].split(b'\0')[0].decode(errors='replace')
          print(f"✅ app @0x20000, version = {ver}")
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-mic-full-bin
          path: full.bin
          if-no-files-found: error
